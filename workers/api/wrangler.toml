#:schema node_modules/wrangler/config-schema.json
name = "vowly-api"
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[d1_databases]]
binding = "DB"
database_name = "vowly-db"
database_id = "00000000-0000-0000-0000-000000000000" # TODO: replace with `wrangler d1 create vowly-db`
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vowly-media"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000" # TODO: replace with `wrangler kv:namespace create vowly-rate-limit`

[vars]
APP_NAME = "vowly"
ENVIRONMENT = "production"

[env.staging]
name = "vowly-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "vowly-db-staging"
database_id = "00000000-0000-0000-0000-000000000000" # TODO: replace with `wrangler d1 create vowly-db-staging --env staging`
migrations_dir = "../../database/migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "vowly-media-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000" # TODO: replace with `wrangler kv:namespace create vowly-rate-limit-staging --env staging`

[env.staging.vars]
APP_NAME = "vowly"
ENVIRONMENT = "staging"
